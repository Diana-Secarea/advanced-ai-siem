<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Selenne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .auth-card { width: 100%; max-width: 400px; padding: 36px; }
  .auth-card h1 { font-size: 26px; margin: 6px 0 4px; }
  .auth-field { margin-top: 16px; }
  .auth-field label { display: block; font-family: var(--font-mono); font-size: 11px; letter-spacing: 1.5px; color: var(--text-dim); margin-bottom: 6px; }
  .auth-field input {
    width: 100%; padding: 11px 14px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04);
    color: var(--text, #e8ecf8); font-size: 14px; outline: none;
  }
  .auth-field input:focus { border-color: rgba(34,211,238,.55); }
  .auth-err { color: #fb7185; font-size: 13px; margin-top: 14px; min-height: 18px; }
  .auth-ok  { color: #34d399; }
  .auth-btn { width: 100%; margin-top: 18px; justify-content: center; }
  .auth-field input.bad { border-color: rgba(251,113,133,.7); }
  .auth-field .field-err { color: #fb7185; font-size: 12px; margin-top: 6px; min-height: 0; }
  .auth-toggle { margin-top: 18px; text-align: center; font-size: 13px; color: var(--text-dim); }
  .auth-toggle a { color: var(--cyan, #22d3ee); cursor: pointer; }
  .auth-forgot { margin-top: 10px; text-align: right; font-size: 12px; }
  .auth-forgot a { color: var(--text-dim); cursor: pointer; }
  .auth-forgot a:hover { color: var(--cyan, #22d3ee); }
</style>
</head>
<body>

<video class="auth-bg-video" autoplay muted loop playsinline preload="metadata" aria-hidden="true"
       onerror="this.style.display='none'">
  <source src="assets/hero-bg.mp4" type="video/mp4">
</video>
<canvas id="particles"></canvas>
<div class="aurora"><span></span><span></span><span></span></div>
<div class="grid-overlay"></div>

<div class="auth-wrap">
  <div class="card auth-card keyart">
    <a class="brand" href="landing.html" title="Back to landing page"><span class="logo">◈</span><em>SELENNE</em></a>
    <h1 id="authTitle">Sign in</h1>
    <p style="font-size:13px;color:var(--text-dim);" id="authSub">Analyst access to the AI Threat Engine.</p>

    <form id="authForm">
      <div class="auth-field" id="usernameField">
        <label>USERNAME</label>
        <input id="username" autocomplete="username" required>
      </div>
      <div class="auth-field" id="emailField" hidden>
        <label>EMAIL</label>
        <input id="email" type="email" autocomplete="email" maxlength="254">
        <div class="field-err" id="emailErr"></div>
      </div>
      <div class="auth-field" id="passwordField">
        <label>PASSWORD</label>
        <input id="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128">
      </div>
      <div class="auth-forgot" id="forgotLine"><a id="forgotLink">Forgot your password?</a></div>
      <div class="auth-err" id="authMsg"></div>
      <button class="btn btn-primary auth-btn" id="authBtn" type="submit">▶ Sign in</button>
    </form>

    <div class="auth-toggle" id="toggleLine">
      No account yet? <a id="toggleLink">Create one</a>
    </div>
    <div class="auth-toggle"><a href="landing.html">← Back to the landing page</a></div>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
const $ = id => document.getElementById(id);

// Three modes share one form: sign-in, create-account, and forgot-password.
// One form rather than three pages so a visitor who typed their email into
// the wrong one does not lose it when they switch.
const MODES = {
  login: {
    title: "Sign in", sub: "Analyst access to the AI Threat Engine.",
    btn: "\u25b6 Sign in", email: false, password: true, forgot: true,
    toggleText: "No account yet? ", toggleLink: "Create one", toggleTo: "register",
  },
  register: {
    title: "Create account",
    sub: "Pick a username, confirm your email, and choose a password of at least 8 characters.",
    btn: "\u25b6 Create account", email: true, password: true, forgot: false,
    toggleText: "Already registered? ", toggleLink: "Sign in", toggleTo: "login",
  },
  forgot: {
    title: "Reset your password",
    sub: "Enter the email address on your account and we will send you a link to choose a new password.",
    btn: "\u25b6 Email me a reset link", email: true, password: false, forgot: false,
    toggleText: "Remembered it? ", toggleLink: "Back to sign in", toggleTo: "login",
  },
};
let mode = "login";

function setMode(next) {
  mode = next;
  const m = MODES[mode];
  $("authTitle").textContent = m.title;
  $("authSub").textContent = m.sub;
  $("authBtn").textContent = m.btn;
  $("emailField").hidden = !m.email;
  $("email").required = m.email;
  // Forgot-password asks for an email only. The username input is the account
  // key everywhere else, but here we look the account up BY address, so
  // requiring a username would block exactly the person who forgot their
  // credentials.
  $("usernameField").hidden = (mode === "forgot");
  $("username").required = (mode !== "forgot");
  $("passwordField").hidden = !m.password;
  $("password").required = m.password;
  $("password").autocomplete = mode === "register" ? "new-password" : "current-password";
  $("forgotLine").hidden = !m.forgot;
  $("toggleLine").firstChild.textContent = m.toggleText;
  $("toggleLink").textContent = m.toggleLink;
  clearErrors();
}

function clearErrors() {
  $("authMsg").textContent = "";
  $("authMsg").className = "auth-err";
  $("emailErr").textContent = "";
  $("email").classList.remove("bad");
}

function fail(text, field) {
  const msg = $("authMsg");
  msg.className = "auth-err";
  if (field === "email") {
    // Under the offending input, not in the generic line: "this email is
    // already registered" is about the field the user has to change.
    $("emailErr").textContent = text;
    $("email").classList.add("bad");
    $("email").focus();
    msg.textContent = "";
  } else {
    msg.textContent = text;
  }
}

function succeed(text) {
  const msg = $("authMsg");
  msg.className = "auth-err auth-ok";
  msg.textContent = text;
}

// Result of clicking the link in the verification email.
(() => {
  const q = new URLSearchParams(location.search);
  const v = q.get("verify");
  if (q.get("reset") === "ok") {
    succeed("Password updated \u2014 sign in with your new password.");
  }
  if (!v) return;
  if (v === "ok") {
    succeed("Email confirmed \u2014 sign in to download your collector.");
  } else {
    // "request a new one" alone strands people: the resend control is the
    // banner inside the console, which they only see after signing in.
    fail((q.get("reason") || "Verification failed.") +
      " Sign in and use \u201cResend email\u201d at the top of the page for a fresh link.");
  }
})();

// Where to go after sign-in. ?next= lets the AI Agents console (/agents/,
// a different server on the same origin) send people here and get them back.
// Only a same-origin PATH is accepted: "//evil.com" or "/\\evil.com" would
// be read by the browser as another host, i.e. an open redirect.
function nextTarget() {
  const n = new URLSearchParams(location.search).get("next") || "";
  return /^\/(?![\/\\])[^\s]*$/.test(n) ? n : "/";
}

// Already signed in? Straight to where they were going.
fetch("/api/auth/me").then(r => { if (r.ok) location.href = nextTarget(); }).catch(()=>{});

$("toggleLink").addEventListener("click", () => setMode(MODES[mode].toggleTo));
$("forgotLink").addEventListener("click", () => setMode("forgot"));
$("email").addEventListener("input", () => {
  $("emailErr").textContent = "";
  $("email").classList.remove("bad");
});

async function post(url, payload) {
  const r = await fetch(url, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  return [r, await r.json().catch(() => ({}))];
}

$("authForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearErrors();
  $("authMsg").textContent = "\u2026";
  const username = $("username").value;
  const password = $("password").value;
  try {
    if (mode === "forgot") {
      const [r, d] = await post("/api/auth/password/forgot", { email: $("email").value });
      if (!r.ok) {
        fail(d.error || "Could not send the reset email \u2014 try again shortly.");
        return;
      }
      succeed(d.warning || d.message);
      return;
    }
    if (mode === "register") {
      const [r, d] = await post("/api/auth/register",
        { username, password, email: $("email").value });
      if (!r.ok) { fail(d.error || "Registration failed", d.field); return; }
      // Deliberately does NOT sign in: the account is unverified until the
      // emailed link is opened, and collector downloads stay blocked till then.
      succeed(d.warning || d.message || "Check your email to confirm your address.");
      return;
    }
    const [r, d] = await post("/api/auth/login", { username, password });
    if (!r.ok) { fail(d.error || "Login failed"); return; }
    location.href = nextTarget();
  } catch (err) {
    fail("Backend unreachable \u2014 is the server running?");
  }
});

setMode("login");
</script>
</body>
</html>
