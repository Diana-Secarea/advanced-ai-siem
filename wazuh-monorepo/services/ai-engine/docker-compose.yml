# Project name pinned to the pre-monorepo directory name so compose keeps
# managing the SAME containers/volumes it created before the restructure.
name: ai_threat_engine_starter

services:

  qdrant:
    image: qdrant/qdrant:latest
    container_name: wazuh_qdrant
    ports:
      - "127.0.0.1:6333:6333"   # REST API — localhost only
      - "127.0.0.1:6334:6334"   # gRPC — localhost only
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      # The qdrant image ships no curl or wget, so the obvious `curl -f /readyz`
      # can never run — it fails with "executable file not found" and the
      # container reports (unhealthy) forever while Qdrant is perfectly fine.
      # bash IS present, so speak HTTP over /dev/tcp instead.
      test: ["CMD", "bash", "-c",
             "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    container_name: wazuh_postgres
    env_file:
      - ../../apps/backend/.env
    environment:
      POSTGRES_DB: ${PG_DB:-wazuh_ai}
      POSTGRES_USER: ${PG_USER:-wazuh}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./rag_core/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wazuh -d wazuh_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qdrant_storage:
    name: wazuh_qdrant_storage
  postgres_data:
    name: wazuh_postgres_data
