<!--
  Shared collector configuration — pushed automatically to every endpoint in
  the `default` group. Widens collection beyond the package defaults so Selenne
  sees the whole log surface of each machine, not just the usual few files.
-->

<agent_config os="Linux">

  <!-- systemd journal: every unit, every service, on modern distros -->
  <localfile>
    <log_format>journald</log_format>
    <location>journald</location>
  </localfile>

  <!-- classic syslog files (distros that still write them) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/messages</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/secure</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/kern.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/dpkg.log</location>
  </localfile>
  <!-- anything else dropping .log files in /var/log -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/*.log</location>
  </localfile>

  <!-- who is logged in right now -->
  <localfile>
    <log_format>full_command</log_format>
    <command>who -a</command>
    <alias>logged-in users</alias>
    <frequency>300</frequency>
  </localfile>

</agent_config>


<agent_config os="Darwin">

  <!-- Apple Unified Logging: the modern macOS log firehose (logins, sudo,
       process execution, network, security subsystem) -->
  <localfile>
    <log_format>macos</log_format>
    <location>macos</location>
    <query type="trace,activity,log" level="info"></query>
  </localfile>

  <!-- legacy files still written by some daemons -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/system.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/install.log</location>
  </localfile>

  <!-- who is logged in right now -->
  <localfile>
    <log_format>full_command</log_format>
    <command>who -a</command>
    <alias>logged-in users</alias>
    <frequency>300</frequency>
  </localfile>

</agent_config>


<agent_config os="Windows">

  <!-- the three core channels -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Application</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- process creation / network / registry detail, when Sysmon is present -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- script-block logging catches fileless / living-off-the-land attacks -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Windows PowerShell</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- remote access: RDP session activity -->
  <localfile>
    <location>Microsoft-Windows-TerminalServices-LocalSessionManager/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- built-in AV verdicts -->
  <localfile>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- host firewall drops / rule changes -->
  <localfile>
    <location>Microsoft-Windows-Windows Firewall With Advanced Security/Firewall</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- task scheduler: a classic persistence mechanism -->
  <localfile>
    <location>Microsoft-Windows-TaskScheduler/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

</agent_config>
