# Wazuh AI Threat Engine — MLOps monitoring stack
#
#   Jenkins      :8080  — pipeline orchestration (retraining, testing, RAG eval)
#   Prometheus   :9090  — metrics store; scrapes the Flask backend + Pushgateway
#   Pushgateway  :9091  — batch jobs (training/eval) push their metrics here
#   Grafana      :3000  — dashboards for the ML engine and the AI (RAG) engine
#
#   docker compose up -d
#
# Jenkins build jobs execute on the WSL HOST (label 'wazuh-host') so they can
# use the project venv, the GPU and /var/ossec — see README.md for connecting
# the host as an inbound agent.

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: wazuh-ai-jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"     # UI
      - "50000:50000"   # inbound agent port (host agent connects here)
    volumes:
      - jenkins_home:/var/jenkins_home
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true

  prometheus:
    image: prom/prometheus:latest
    container_name: wazuh-ai-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach the Flask backend on the host

  pushgateway:
    image: prom/pushgateway:latest
    container_name: wazuh-ai-pushgateway
    restart: unless-stopped
    ports:
      - "9091:9091"

  grafana:
    image: grafana/grafana:latest
    container_name: wazuh-ai-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-shield-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  jenkins_home:
  prometheus_data:
  grafana_data:
